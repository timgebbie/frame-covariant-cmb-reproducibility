# Implementation register — the audit spine of this bundle.
#
# One entry per quantity that the numerics implement, linking
#
#     published equation  ->  provenance  ->  the code that implements it
#                                          ->  the test that checks it
#
# \\texttt{scripts/make\\_tables.py} generates tables/ from this file, and the supplement
# includes those tables. \\texttt{tests/test\\_register.py} checks that every \\texttt{module} and
# \\texttt{object} named here actually resolves, so a rename breaks the build rather than
# silently falsifying the table.
#
# \\textbf{Equation numbers are PUBLISHED numbers.} The published and arXiv numberings
# of the Annals papers differ, and not by a constant offset.

[meta]
version = "1.0.0"
generated_by = "scripts/make_tables.py"

# --- sources, cited once and referenced by key ------------------------------

