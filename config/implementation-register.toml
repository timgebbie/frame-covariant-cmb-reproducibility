# --- notation -----------------------------------------------------------------

[[notation]]
symbol = "$\\tau(x,e)$"
code = "---"
meaning = "temperature anisotropy as a function of position and direction"
note = ""

[[notation]]
symbol = "$\\tau_{A_\\ell}$"
code = "---"
meaning = "\\textbf{multipole} coefficients --- the covariant objects"
note = "valid for general geometries; what every released figure plots"

[[notation]]
symbol = "$\\tau_\\ell$"
code = "tau, values"
meaning = "\\textbf{mode} coefficients"
note = "almost-Robertson--Walker only. Conflating these two is how a sign is lost"

[[notation]]
symbol = "$O^{A_\\ell}$"
code = "---"
meaning = "$e^{\\langle A_\\ell\\rangle}$, the PSTF basis on the sphere"
note = "Annals I (15)"

[[notation]]
symbol = "$Q_{A_\\ell}$"
code = "---"
meaning = "harmonic basis tensor, $(-k_{\\rm phys})^{-\\ell}\\mathrm{D}_{\\langle A_\\ell\\rangle}Q$"
note = "the adopted normalisation; see criterion 3"

[[notation]]
symbol = "$\\beta_\\ell$"
code = "beta"
meaning = "$O^{A_\\ell}O_{A_\\ell}$"
note = "Hu \\& Sugiyama's normalisation"

[[notation]]
symbol = "$\\alpha_\\ell$"
code = "alpha"
meaning = "$(2\\ell+1)/\\beta_\\ell$"
note = "Ma \\& Bertschinger's and Seljak \\& Zaldarriaga's normalisation"

[[notation]]
symbol = "$k_{\\rm com}$"
code = "k_com"
meaning = "comoving wavenumber"
note = "\\textbf{never a bare \\texttt{k} in this codebase}"

[[notation]]
symbol = "$k_{\\rm phys}$"
code = "k_phys"
meaning = "physical wavenumber, $k_{\\rm com}/a$"
note = "Appendix F's $k$ is comoving; the conventions sheet's is physical"

[[notation]]
symbol = "$\\eta$"
code = "eta"
meaning = "conformal time, $dt = a\\,d\\eta$"
note = ""

[[notation]]
symbol = "$\\Delta\\eta_*$"
code = "d_eta"
meaning = "$\\eta_0-\\eta_*$"
note = ""

[[notation]]
symbol = "$j_\\ell$"
code = "spherical_jn"
meaning = "spherical Bessel function"
note = "the free-streaming solution"

[[notation]]
symbol = "$u^a$"
code = "---"
meaning = "the threading 4-velocity"
note = "carried generic; frames are specialisations made at the end"

[[notation]]
symbol = "$\\sigma_{ab}$"
code = "---"
meaning = "shear"
note = "$\\sigma$ is the shear and nothing else"

[[notation]]
symbol = "$A_a$"
code = "---"
meaning = "acceleration, $\\dot u_a$"
note = ""

[[notation]]
symbol = "$\\Theta_\\ell$"
code = "---"
meaning = "Hu \\& Sugiyama's multipole variable"
note = "$\\beta$-normalised"
