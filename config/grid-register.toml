# Grid register — every discretisation in this bundle, and what is known about it.
#
# **Why this file exists.** Three findings in eight days were one failure:
# `n_eta` fixed rather than derived (T-3), the k grid guarded by a comment
# rather than by code (S24's correction to itself), and the recombination grid
# setting the primary source with nothing guarding it (T-46/Q7). Fixing a third
# instance does not stop a fourth. Naming every grid, and failing when the code
# grows one this file does not list, does.
#
# `scripts/make_grid_register.py` walks the AST of `functions/` and `scripts/`
# for `linspace`, `arange`, `logspace` and `geomspace`, joins against this file,
# and **fails** on a site that is not registered or a registration whose site has
# gone. The register in `provenance/GRID-REGISTER-v1.md` is generated from it.
#
# `status` is one of:
#
#   derived   computed from a physical scale by code that RAISES if the scale
#             cannot be met. The only status that cannot silently degrade.
#   measured  a chosen literal whose convergence has been measured, with the
#             number in `note`.
#   described a chosen literal governed by a stated rule, with the rule named
#             and a guard elsewhere that can fail.
#   index     an exact integer or index array. Not a discretisation: no
#             resolution to get wrong. Listed so that it is excluded on the
#             record rather than by nobody looking.
#   open      a chosen literal whose convergence is NOT established here. This
#             status is the point of the file. It must carry what is known and
#             the question or decision that owns it.
#
# `key` is `<path>::<name>`, the assignment target, not a line number — line
# numbers move and a register that drifts is worse than none.

# ---------------------------------------------------------------------------
# The open one. Q7's row, and the reason Coordination asked for this table.
# ---------------------------------------------------------------------------
[[grid]]
key = "functions/spectra/decoupling.py::eta"
what = "the recombination history: kappa', visibility and opacity in eta"
status = "open"
note = """**1.2% in the primary source at eta_*, measured.** `n_eta=4000`, spacing
4.9e-04, which is COARSER than the line-of-sight grid it is interpolated onto.
Refining it 4000 -> 64000 moves the primary source -118.321 -> -119.788. Nothing
derives or guards it. Criterion 5b's gate CANNOT bound it: both of its routes
share this history, so a grid shift moves them together and cancels. Finding
**T-46**, question **Q7**, decision **S33** --- derived immediately after the
v1.2.0 tag. v1.2.0 ships it as a stated limit."""

# ---------------------------------------------------------------------------
# Derived, and guarded by code that raises.
# ---------------------------------------------------------------------------
[[grid]]
key = "functions/spectra/acoustic.py::eta"
what = "the samples r_s(eta) = Int_0^eta c_s deta is accumulated on"
status = "measured"
note = """**Logarithmic, and that is not a style choice.** c_s -> 1/sqrt(3) as
eta -> 0 while the span to eta_* covers five decades, so a uniform grid spends
every sample where the integrand is flat and none where it turns over.
`RS_SAMPLES = 400000` over [1e-9, eta_*]. Convergence measured 2026-10-16:
r_s(eta_*) for PLANCK_MODEL is 0.036135 at 1e5, 4e5 AND 1.6e6 samples, and
the missing fraction D9 reports is 0.5077 at all three --- identical to every
printed figure, which is what a ratio of two accumulations on one grid should
do, since a common quadrature error cancels. The lower limit 1e-9 is converged
too, and measured rather than argued: r_s = 0.036134482 at 1e-7, 0.036134539 at
1e-9, 0.036134540 at 1e-11, so 1e-9 is right to nine figures and the missing
fraction is 0.507688 at all three. c_s is bounded by 1/sqrt(3), so no cutoff
this low can matter against the 51-64% that finding **T-51** is about."""

[[grid]]
key = "functions/spectra/two_frame.py::mode_eta"
what = "one acoustic mode's integration grid on the (102) generic-u^a route"
status = "derived"
note = """The same construction as `pipeline.py::mode_eta` and in the same
release, because **T-51 had one instance per route**: `pipeline.run`,
`two_frame.coefficient_sets` and `two_route.two_route_transfer` each began
every mode at the recombination grid's first point, and all three therefore
agreed. Criterion 5b compares the first and third of those; F2, F5, F7, F9, D6
and D7 all take the second. T-3's lesson in triplicate --- two agreeing routes
agree about what they share, and three is not better. `required_acoustic_points`
and `acoustic_start_eta` are shared, so the three cannot drift apart again."""

[[grid]]
key = "functions/spectra/two_route.py::mode_eta"
what = "one acoustic mode's integration grid inside criterion 5b's gate"
status = "derived"
note = """`required_acoustic_points`, floored at the gate's own `n_eta` so that
the mode grid is never coarser than the line-of-sight grid it is interpolated
onto --- finding **T-46**'s lesson, which was that the binding grid is the
coarser of the two and nobody had checked which. **This gate could not see
T-51**: both its routes share one acoustic solution by construction, so a
truncated start moved them together and cancelled, and 5b sat at 9.5e-06 with
half the sound horizon missing from both sides. Measured after the fix:
8.240e-06. The number barely moved, which is the correct behaviour for a gate
that tests assembly algebra --- and is exactly why **S4c** says it cannot
stand in for an external comparison."""

[[grid]]
key = "functions/spectra/pipeline.py::mode_eta"
what = "one acoustic mode's own integration grid, from its derived start"
status = "derived"
note = """`required_acoustic_points(k, eta_couple - start)` at 24 samples per
acoustic oscillation, on a floor of 512. Arithmetic, not a knob: delta_T goes
as cos(k r_s) with period 2 pi/(k c_s) in eta, and c_s^2 = 1/(3(1+R)) <= 1/3
BOUNDS that period below by 2 pi sqrt(3)/k --- so the rate is computed from k
the way `required_n_eta` is computed from k_max. The span is per mode because
the START is per mode: `acoustic_start_eta(k)` returns the eta at which
k r_s(eta) <= 0.1, finding **T-51**. One fixed point count cannot serve a band
spanning a factor of two thousand in k, which is why no number is chosen."""

[[grid]]
key = "functions/spectra/pipeline.py::master"
what = "the grid Phi_A and Phi_H are splined on, shared by every mode"
status = "index"
note = """16384 logarithmic samples from the earliest acoustic start to
eta_couple. **It carries no physical scale of its own**: it resamples a
quantity that does not depend on k at all, so that `potentials` runs its growth
integration ONCE rather than 1433 times. Phi_A is smooth and nearly constant
over it. Convergence is `potentials`' own, measured at its `GROWTH_SAMPLES`
row, not this spline's: Phi_A(eta_*) for PLANCK_MODEL agrees to twelve figures
between 4096 and 16384 internal samples, and to twelve figures across input
grids spanning three decades in their lower limit."""

[[grid]]
key = "functions/spectra/pipeline.py::eta"
what = "the line-of-sight integration grid for C_ell"
status = "derived"
note = """`required_n_eta(k_max, span)` at 12 samples per j_ell oscillation, and
`run` RAISES rather than accepting an n_eta below it --- *"Pass n_eta=None to
derive it. See finding T-3."* This is the guard T-3 produced, and it is the
template the other rows are measured against."""

[[grid]]
key = "functions/spectra/two_route.py::eta"
what = "the eta grid for criterion 5b's gate, both routes"
status = "derived"
note = """`required_n_eta` at **48** samples per oscillation, four times the C_ell
route's twelve, on a floor of 8000. The higher rate is not caution: this
comparison measures the DIFFERENCE between two quadrature errors, which does not
fall the way either does. It was fixed at 4000 and that is finding **T-45** ---
both routes un-converged in the same direction, agreeing two hundred times
better than they do. `test_the_eta_grid_is_derived_from_k_and_not_fixed` holds
it derived."""

[[grid]]
key = "functions/spectra/two_frame.py::eta"
what = "the eta grid for the two-frame evaluation of (102): F2, F5, F7"
status = "derived"
note = """`required_n_eta(k_max, span)` when `n_eta is None`, which is how every
figure calls it, and `check_k` RAISES when a caller asks for a mode the grid
cannot resolve --- the guard finding **T-34** produced after F7 sized its grid
for k=140 and integrated to k=420. A caller may still pass `n_eta` explicitly;
nothing in the bundle does."""

[[grid]]
key = "functions/spectra/bessel_table.py::x"
what = "the x grid j_ell(x) is tabulated on"
status = "derived"
note = """`n = max(int(points_per_period * x_max / pi), 64)` --- computed from
`x_max`, not accepted from a caller, with a floor. Twelve samples per
oscillation, the same rate as the eta grid, and deliberately so: the two grids
resolve one function and there is no reason for them to disagree about how
finely."""

