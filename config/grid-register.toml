note = """Same derivation as D24, whose `ELLS`, `K_MAX` and peak finder this
instrument **imports rather than restates**, so its numbers are comparable to
T-121's line by line. A second copy here would make the comparison meaningless
the first time either moved."""

[[grid]]
key = "scripts/diagnostic_d29_the_identity.py::k_com"
what = "the k grid B-17's identity is scored on at released kappa''"
status = "derived"
note = """Imported from D24 for the same reason as D28. This instrument is the
first to run `bracket_all_at_w`, so it must be comparable to the configurations
that preceded it or the comparison it exists to make cannot be read."""

# ---------------------------------------------------------------------------
# Added at v1.3.0 with D30 and F10 --- the accumulation in conformal time. The
# slice grids are the new kind here: every other row in this file registers a
# grid an integral is EVALUATED on, and these two register where a completed
# integral is SAMPLED. That distinction is the reason both are `index` and the
# reason it has to be said out loud: a reader who assumed the slice count set
# the quadrature would read a convergence claim into a figure that makes none.
# ---------------------------------------------------------------------------

[[grid]]
key = "scripts/diagnostic_d30_formation_surface.py::sl"
what = "the conformal times the accumulated C_ell is reported at"
status = "index"
note = """`eta_* + geomspace(span*1e-4, span, N_SLICES-1)` with a zero
prepended, 24 slices. **It selects and it does not compute.** The bulk is
accumulated cumulatively inside the released quadrature in ONE pass and then
interpolated onto these abscissae, so the slice count sets how finely the
curve is read and changes no value on it --- which is also why doubling it
does not make the late share less zero. Geometric because the visibility is
narrow: a linear grid of 24 would put 23 points in the free-streaming era,
where by construction nothing is laid down, and one point across the whole of
recombination."""

[[grid]]
key = "scripts/diagnostic_d30_formation_surface.py::k_com"
what = "the k grid the accumulated C_ell is integrated over"
status = "derived"
note = """`required_k_points(K_MAX, r_theta)` at 3 samples per j_ell^2
oscillation --- T-56's derivation, as everywhere else. K_MAX = 300 rather than
F9's 1500: nothing above the first peak is being asked about and the grid
would spend its resolution there. **This one is NOT free.** Gate 1 is that the
eta_0 slice reproduces the released quadrature, and it is computed on this
grid, so an aliased grid here would void the comparison rather than loosen
it."""

[[grid]]
key = "scripts/figure_f10_formation_surface.py::pre"
what = "the conformal times F10 samples ACROSS recombination"
status = "index"
note = """`linspace(eta_floor, eta_star, 4)`. **Linear, not geometric, and
deliberately so**: the PI asked for the autocorrelation *just before
decoupling, at decoupling, and after*, and those three are only separable if
the grid resolves the interval they live in. The lower limit is the
recombination START (T-58), not eta_*, so "before decoupling" is a real epoch
with real accumulation rather than an empty panel. It SELECTS and does not
compute --- the bulk is accumulated inside the released quadrature in one pass
and interpolated onto these abscissae."""

[[grid]]
key = "scripts/figure_f10_formation_surface.py::post"
what = "the conformal times F10 samples AFTER recombination"
status = "index"
note = """`eta_* + geomspace(span*1e-4, span, N_SLICES-4)`, ten slices.
Geometric because the visibility is narrow and a linear grid would put every
point in the free-streaming era. With `pre` this is the PI's "low granulation
in time" --- fourteen epochs, few enough that each curve in panel (a) is
distinguishable and enough to read a progression."""

[[grid]]
key = "scripts/figure_f10_formation_surface.py::k_com"
what = "the k grid F10's accumulation is integrated over"
status = "derived"
note = """`required_k_points(K_MAX, r_theta)`, K_MAX = 300, matching D30
exactly so the figure and the diagnostic behind it are the same measurement.
The figure carries D30's gate 1 too --- the eta_0 column against the released
quadrature, 1.2e-12 --- and refuses to write either the CSV or the picture if
it fails, so an aliased grid stops the artefact rather than appearing in
it."""

[[grid]]
key = "scripts/diagnostic_d32_isw_discriminator.py::sl"
what = "the conformal times the ISW discriminator reports the late share at"
status = "index"
note = """Same construction as D30's, at 12 slices. The question is only
"before or after the visibility closed", and the answer is read at a single
abscissa (1% of the span past eta_*), so the slice count sets how finely the
curve is interpolated there and nothing else. D30 runs 24 and F10 16 on the
same object."""

[[grid]]
key = "scripts/diagnostic_d32_isw_discriminator.py::k_com"
what = "the k grid the ISW discriminator integrates the late share over"
status = "derived"
note = """`required_k_points(K_MAX, r_theta)` at 3 samples per j_ell^2
oscillation, K_MAX = 120 rather than D30's 300: this instrument asks only
about ell = 2 and 10, the late ISW is superhorizon, and nothing above the
first peak is being looked at. **The gate is on this grid** --- the eta_0
slice against the released quadrature --- so an aliased grid would void the
columns rather than loosen them."""

[[grid]]
key = "scripts/figure_f10_formation_surface.py::ELLS"
what = "the multipoles F10's surface is drawn over"
status = "index"
note = """Dense below 30, then stepping by 20 to 300. **This is the axis the
first version of F10 threw away**, and the reason the rebuild exists: the
plateau is a statement about ell-dependence at fixed eta, so a figure that
samples six multipoles and normalises each one cannot show it. Dense at low
ell because that is where the plateau's shape is; to 300 because the first
acoustic peak must be on the picture for the frozen shape to be legible. The
damping tail is F9's and is not drawn."""

[[grid]]
key = "scripts/diagnostic_d33_w_path_integral.py::ELLS"
what = "the multipoles the (98) W-weighted path integral is scored on"
status = "index"
note = """Dense below 30, then `arange(40, 321, 20)`. The pre-registration
asks three questions of three different parts of this axis: the late share at
the quadrupole, the plateau as `D_2/D_30`, and whether the first peak moves.
Prediction 3 is the one the step size constrains --- at 20 the peak is located
to half a step, which is enough to say *moved* or *did not move* but not
enough to quote a position. D34 steps by 10 for precisely that reason."""

[[grid]]
key = "scripts/diagnostic_d33_w_path_integral.py::sl"
what = "the conformal times D33 reports the late share at"
status = "index"
note = """Same construction as D30's at 12 slices --- `eta_* +
geomspace(span*1e-4, span, 11)` with a zero prepended. It SELECTS and does not
compute: the accumulation is the released quadrature in one pass, read at one
abscissa (1% of the span past eta_*), so the slice count sets how finely that
single interpolation is resolved and nothing else. Geometric because the
visibility is narrow and a linear grid would put every slice in the
free-streaming era."""

[[grid]]
key = "scripts/diagnostic_d33_w_path_integral.py::k_com"
what = "the k grid D33 integrates the plateau and the peak over"
status = "derived"
note = """`required_k_points(K_MAX, span)`, K_MAX = 420. Derived at 3 samples
per `j_ell^2` oscillation and raising if the scale cannot be met. K_MAX is
above the first peak because prediction 3 is a statement about the peak's
position, and a k grid truncated below it would answer that question by
construction. **The gate rides on this grid** --- the eta_0 slice against the
released quadrature --- so aliasing voids the columns rather than loosening
them."""

[[grid]]
key = "scripts/diagnostic_d34_split_by_parts.py::ELLS"
what = "the multipoles P1-T's split by-parts is scored on"
status = "index"
note = """Dense at the plateau (2--30) then `arange(40, 341, 10)`.
**The step is 10 and not 20 because prediction 2 is `236.6 +/- 5`**: a grid
that cannot resolve 5 multipoles cannot score it, and the peak is read by
parabolic interpolation through three samples rather than by argmax, so the
quoted position is finer than the step. Dense below 30 because prediction 3 is
the `ell ~ 7` bump against `D_30`, which needs both ends present. To 340 so
that a peak which ran PAST 236.6 --- the outcome fixed as a different finding
--- would still be on the grid rather than falling off it."""

[[grid]]
key = "scripts/diagnostic_d34_split_by_parts.py::sl"
what = "the conformal times D34 reports the late share at"
status = "index"
note = """As D33's, 12 slices, same construction and the same argument. The
late share is the EdS null control, read at one abscissa; the slice count sets
the interpolation there. It is worth saying plainly that this grid is not what
made the null read 1.0000 --- T-155 measured the share to be a quotient whose
denominator the repair collapsed, which is an arithmetic property of the
metric and not of the abscissae it is read at."""

[[grid]]
key = "scripts/diagnostic_d34_split_by_parts.py::k_com"
what = "the k grid D34 integrates the bump, the plateau and the peak over"
status = "derived"
note = """`required_k_points(K_MAX, span)`, K_MAX = 460 --- the largest in the
bundle, and higher than D33's 420 because the peak is predicted to MOVE here
and a truncation that clipped its new position would be indistinguishable from
the prediction failing. Derived, raising if 3 samples per oscillation cannot
be met."""

[[grid]]
key = "scripts/diagnostic_d35_which_term_accumulates.py::sl"
what = "the conformal times D35 reports the late share at"
status = "index"
note = """As D33's and D34's, 12 slices. D35 asks only which bracket term
survives to the right of the visibility, so the abscissa is the same single
one and the grid carries no more weight here than in the two instruments it
suppresses terms inside of."""

[[grid]]
key = "scripts/diagnostic_d35_which_term_accumulates.py::k_com"
what = "the k grid D35 integrates the term-by-term late share over"
status = "derived"
note = """`required_k_points(K_MAX, span)`, K_MAX = 160 --- far below D34's
460, and deliberately. D35 scores NO peak and NO position: it reports the late
share at three multipoles with one bracket term blanked at a time, and the
late share is a ratio of the same integral to itself. Carrying 460 would cost
three times the k loop to sharpen a number the instrument does not read.
Derived nonetheless, so the reduction is a stated choice rather than a
truncation."""

[[grid]]
key = "scripts/diagnostic_d36_frame_invariance_by_weighting.py::ELLS"
what = "the multipoles the frame gap is scored over"
status = "index"
note = """Dense through the plateau (2--30), then `arange(40, 341, 15)`. The
scored quantity is the MEDIAN frame gap over this axis, so the step sets how
the median is weighted between the plateau and the acoustic band and nothing
else --- a frame gap of order unity does not need resolving to a multipole.
To 340 so the first peak is on the axis for every background, because the
Newtonian peak's existence (or absence, which is T-157's finding) is read
from the same grid."""

[[grid]]
key = "scripts/diagnostic_d36_frame_invariance_by_weighting.py::k_com"
what = "the k grid the frame gap is integrated over"
status = "derived"
note = """`required_k_points(K_MAX, span)`, K_MAX = 460, matching D34 so the
two instruments measure the same configurations on the same quadrature and a
disagreement between them is a finding rather than a grid artefact. Derived at
3 samples per `j_ell^2` oscillation and raising if the scale cannot be met.
**The gate rides on this grid** --- the eta_0 slice against the released
quadrature, measured at 3.8e-14 up to k = 1500 --- so aliasing voids the
columns rather than loosening them."""

[[grid]]
key = "scripts/diagnostic_d38_which_half_carries_the_residue.py::sl"
what = "the conformal times D38 reports Delta S's support at"
status = "index"
note = """`eta_* + geomspace(span*1e-4, span, 23)` with a zero prepended, **24
slices and not D35's 12**. The extra resolution is load-bearing here and is
not elsewhere: D35 reads a single abscissa, while this one asks WHERE the
support of |Delta S| lies and so integrates the curve's shape across the
visibility. The reported quantity is `max |Delta S| inside` against
`|Delta S| total`, which needs the interior resolved rather than one point
interpolated. Geometric for the usual reason --- the visibility is narrow and
a linear grid would put every slice in the free-streaming era, which is
exactly the region T-155 showed the movement is NOT in."""

[[grid]]
key = "scripts/diagnostic_d38_which_half_carries_the_residue.py::k_com"
what = "the k grid D38 integrates Delta S over"
status = "derived"
note = """`required_k_points(K_MAX, span)`, K_MAX = 160, matching D35 exactly
so the two instruments' residue numbers are comparable and a disagreement
between them is a finding rather than a grid artefact. 160 and not D34's 460
for D35's reason: this scores no peak and no position, only a ratio of an
integral to itself, and carrying 460 would cost three times the k loop to
sharpen a number the instrument does not read. Derived nonetheless, so the
reduction is a stated choice rather than a truncation."""

[[grid]]
key = "scripts/figure_f10_formation_surface.py::LEVELS"
what = "the filled contour levels of F10's panel (b)"
status = "index"
note = """`linspace(0.0, 1.0, 21)` --- **a set of drawing levels, not a
discretisation of anything continuous**, which is what `index` is for. It is
registered because the AST walk caught it the moment the panel became a
contour plot, and that is the register working rather than a false positive:
a rule that exempts arrays which "obviously" do not matter is a rule somebody
has to adjudicate, and T-3 is what happens when they adjudicate wrongly.

Twenty-one levels, and `LABELLED` draws lines at 0.25, 0.50, 0.75, 0.90 and
**0.99**. The last is deliberate: the whole question panel (b) answers is
whether anything arrives after the visibility closes, and the difference
between 0.99 and 1.00 is the entire late integrated Sachs--Wolfe budget. A
level set that stopped at 0.90 could not show the thing the figure is for."""

[[grid]]
key = "scripts/diagnostic_d39_eta_grid_convergence.py::k_com"
what = "the k grid D39 integrates over"
status = "derived"
note = """`required_k_points(K_MAX, span)` at K_MAX = 300, held fixed across
every refinement so the only thing moving is n_eta. 300 and not 1500 because
the DERIVED count at 300 reproduces 12.0 samples per j_l zero spacing exactly
--- the band-edge condition a k_max = 1500 run sits at --- so the question is
answered for the price of a 300 pass. Raising K_MAX here would change what is
being measured, not sharpen it."""

[[grid]]
key = "scripts/diagnostic_d40_recombination_grid_bias.py::k_com"
what = "the k grid D40 integrates over"
status = "derived"
note = """`required_k_points(K_MAX, span)` at K_MAX = 300, held fixed across
every refinement of the RECOMBINATION grid so the only thing moving is the one
D39 held still. Matching D39's K_MAX exactly is the point rather than a
convenience: the two instruments refine different grids and their numbers are
only comparable if everything else is the same, and T-172's conclusion -- that
the two errors are separate and distinguishable by their ell-dependence --
rests on that comparison. 300 also cannot carry the multipoles the secondaries
live at, which is stated here because the follow-up run T-172 calls for will
need a different K_MAX and must therefore be a different row."""

[[grid]]
key = "functions/spectra/two_frame.py::grid"
what = "the common acoustic grid coefficient_sets_batch integrates every mode on"
status = "derived"
note = """`required_acoustic_points(k.max(), eta_couple - min(start))` -- the
same rule the released per-mode path uses, taken at the STIFFEST mode over the
WIDEST span, because a common grid cannot be coarser than its worst mode
demands. The starts are not common: each mode is held at its own initial
condition until its own `acoustic_start_eta` (T-166 measured that a common
start moves tau_1 by 1.4e-02, so the per-mode start is physics). Registered
although nothing released calls it: T-175 has it reproducing delta_T and tau_1
at 2.5e-08 and C_1' only to 5.0e-03, so it is not adoptable yet, and a grid
that is unregistered until it is adopted is a grid nobody reviews before the
commit that adopts it."""

[[grid]]
key = "scripts/diagnostic_d41_newtonian_maximum_on_a_fine_grid.py::k_com"
what = "the k grid D41 integrates over"
status = "derived"
note = """`required_k_points(K_MAX, span)` at K_MAX = 460, D36's exactly. The
point of this instrument is that ONE thing differs from D36 -- the ell grid --
so that a disagreement is the grid and not the band. Raising K_MAX would
sharpen nothing here: the question is whether a maximum exists at ell near 60,
which is far inside the band 460 already carries."""

[[grid]]
key = "scripts/diagnostic_d41_newtonian_maximum_on_a_fine_grid.py::ELLS"
what = "the fine ell grid D41 re-finds the Newtonian maximum on"
status = "index"
note = """`arange(28, 141, 1)` through the band D36's claim lives in, with
`arange(145, 341, 15)` above it and D36's plateau points below. Step ONE where
D36 steps fifteen, which is the entire instrument: D36 reports a Newtonian
maximum at ell = 60.65 from samples at 55, 70 and 85, and the parabola's vertex
lands 0.62 of a grid step from the sample it was fitted around -- a finder on a
node rather than on a peak, which is D24's shape. D36's own grid is IMPORTED
rather than reproduced, so the coarse comparison runs on the registered array
and not on a copy of it."""
