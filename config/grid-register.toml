for a measured quadrature error of up to 22.5% against the closed form
Int dk j_l^2/k = 1/(2 l (l+1)). Finding **T-56**: the eta grid was derived from
the oscillation it resolves and the k grid never was, though it is the same
kernel read along the other axis."""

[[grid]]
key = "scripts/diagnostic_d10_radiation_driving.py::grid"
what = "the acoustic grid D10 scopes A-3 on, and measures the inadequacy of"
status = "measured"
note = """`required_acoustic_points(k, couple - start)` --- the SAME grid the
released oscillator runs on, deliberately, because D10's subject is whether
that grid can carry the radiation era. **It cannot**: measured, it puts 3
points below equality at k=10 and 26 at k=600, out of 512. A splice on three
points is a step in Phi-prime, and the first draft of D10 read a sign flip in
delta_T(eta_*) off a 0.13% change in Phi because of it. The row is `measured`
rather than `derived` for that reason --- the number that matters here is not
the rate but the count below eta_eq, and D10 prints it in every row."""

[[grid]]
key = "scripts/diagnostic_d11_monopole_driving.py::me"
what = "the acoustic grid D11 reads the two terms of d_delta off"
status = "derived"
note = """`required_acoustic_points(k, couple - start)` on
`[acoustic_start_eta, min(eta_0, TIGHT_COUPLING_FACTOR*eta_star)]` --- the
SAME construction as `two_frame.py::mode_eta` and `d10::grid`, by the same
three lines, deliberately. **D11's whole claim is that a B_0 and Phi_H' are
the two terms the released solver's own `rhs()` forms**, so reading them on
any grid but the released one would answer a different question (that is M4).
The ratio it reports is grid-insensitive for the reason D10's count is not:
both terms are evaluated at the same points and a refinement moves them
together --- and on EdS the Phi_H' column is 1e-10 against 3.7, which no
plausible grid change reaches. Finding **T-79**."""

[[grid]]
key = "scripts/diagnostic_d13_byparts_2x2.py::e2"
what = "D13's refinement probe: the environment grid at 1x, 2x and 4x"
status = "measured"
note = """`linspace(eta[0], eta[-1], (n-1)*mult + 1)` for mult in 1, 2, 4,
with M, W and V interpolated onto it. **This grid exists to measure a floor,
not to carry a result**, which is why it is `measured` and why refining it is
the point rather than a risk. It answers the only question D13's |A-B| can
raise: A and B are the same integral by an exact identity, so a difference is
quadrature or bookkeeping, and a ratio that FALLS under refinement is the
first. Measured: EdS k=10 l=2 runs 2.83e-3 -> 2.20e-3 -> 2.04e-3, and the
oscillatory k=300 l=2 cell runs 1.105 -> 0.279 -> 0.0727, about 4x per
doubling, which is second order and is what trapezoid gives. One cell does NOT
fall --- EdS k=10 l=200, flat at 2.646 --- and that cell is void, |A| being
4e-176 at l >> k.d(eta). Finding **T-85**."""

[[grid]]
key = "scripts/diagnostic_d24_phi_prime_sweep.py::ELLS"
what = "the multipole grid the Phi' sweep locates the first peak on"
status = "described"
note = """Dense at spacing 5 through `arange(100, 421, 5)` and sparse below,
because the sweep reports **ell_peak by parabolic interpolation on three
samples**, not `argmax`. The rule is therefore explicit: the grid must be fine
enough near the maximum that three samples bracket it and the interpolated
position is not spacing-limited above the effect being measured. L4 is the
guard --- the peak finder is run on a synthetic C_ell with a known maximum and
must recover it to better than 0.5 in ell, which is a fifth of this spacing.
Capped at 420 because this instrument needs the first peak **located**, not the
damping tail resolved; F9 owns that and runs to 1000."""

[[grid]]
key = "scripts/diagnostic_d24_phi_prime_sweep.py::k_com"
what = "the k grid the Phi' sweep integrates C_ell on"
status = "derived"
note = """`required_k_points(K_MAX, r_theta)` at 3 samples per j_ell^2
oscillation --- finding **T-56**, the same derivation F9 and D4 use. `K_MAX` is
600 rather than F9's 1500, which is the ell <= 420 this instrument needs and no
more. An aliased k integral moves the interpolated peak, and a sweep whose
*observable is a peak position* cannot afford a grid chosen by eye."""

[[grid]]
key = "scripts/diagnostic_d25_k_decomposition.py::k_com"
what = "the k grid the low-ell k-decomposition is computed on"
status = "derived"
note = """`required_k_points(K_MAX, r_theta)` at 3 samples per j_ell^2
oscillation --- **T-56**. `K_MAX` is 200: this instrument asks only about the
plateau, ell <= 30, and a grid sized for the damping tail would spend its
resolution where nothing is being measured. The derivation matters more here
than in most rows, because the quantity reported IS a property of the k
integral --- an aliased grid would move the median and the shares directly,
and those two numbers are the whole verdict."""
